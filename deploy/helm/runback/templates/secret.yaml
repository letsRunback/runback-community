{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "runback.fullname" . }}
  labels:
    {{- include "runback.labels" . | nindent 4 }}
type: Opaque
stringData:
  NEXT_PUBLIC_SUPABASE_URL: {{ .Values.secrets.NEXT_PUBLIC_SUPABASE_URL | quote }}
  SUPABASE_SERVICE_ROLE_KEY: {{ .Values.secrets.SUPABASE_SERVICE_ROLE_KEY | quote }}
  JWT_SECRET: {{ .Values.secrets.JWT_SECRET | quote }}
  AUDIT_SIGNING_KEY: {{ .Values.secrets.AUDIT_SIGNING_KEY | quote }}
  MODEL_KEY_SECRET: {{ .Values.secrets.MODEL_KEY_SECRET | quote }}
  CRON_SECRET: {{ .Values.secrets.CRON_SECRET | quote }}
  AUDIT_ED25519_PRIVATE_KEY: {{ .Values.secrets.AUDIT_ED25519_PRIVATE_KEY | quote }}
  AUDIT_ED25519_PUBLIC_KEY: {{ .Values.secrets.AUDIT_ED25519_PUBLIC_KEY | quote }}
  RESEND_API_KEY: {{ .Values.secrets.RESEND_API_KEY | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.OPENAI_API_KEY | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.ANTHROPIC_API_KEY | quote }}
  GROQ_API_KEY: {{ .Values.secrets.GROQ_API_KEY | quote }}
{{- end }}
